<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{var t=localStorage.getItem('sc-theme-modern-minimal');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Modern Minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#F4F6F9; --surface:#FFFFFF; --ink:#101625; --muted:#69728A;
    --navy:#0F1C3F; --blue:#2E86DE; --blue-dark:#1F6BB8; --border:#E1E5EC;
    --radius:18px; --shadow:0 1px 2px rgba(16,22,37,.04), 0 20px 40px -16px rgba(46,134,222,.22);
  }
  :root[data-theme="dark"]{
    --page-bg:#0B0F17; --surface:#131826; --ink:#EEF0F5; --muted:#9096A8; --border:#232B3C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 20px 40px -16px rgba(46,134,222,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#0B0F17; --surface:#131826; --ink:#EEF0F5; --muted:#9096A8; --border:#232B3C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 20px 40px -16px rgba(46,134,222,.28);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--page-bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:20px;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;}
  .blob1{width:420px;height:420px;background:var(--blue);top:-140px;left:-120px;}
  .blob2{width:360px;height:360px;background:var(--navy);bottom:-160px;right:-100px;opacity:.25;}
  .theme-toggle{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);z-index:2;}
  .theme-toggle svg{width:18px;height:18px;}
  .theme-toggle .icon-moon{display:block;}
  .theme-toggle .icon-sun{display:none;}
  :root[data-theme="dark"] .theme-toggle .icon-moon{display:none;}
  :root[data-theme="dark"] .theme-toggle .icon-sun{display:block;}
  .card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:44px 40px;width:380px;max-width:100%;}
  .mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;margin-bottom:22px;}
  h1{font-size:22px;font-weight:800;margin:0 0 4px;}
  .sub{margin:0 0 28px;color:var(--muted);font-size:14px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .field label{font-size:12px;font-weight:700;color:var(--ink);}
  .field input{border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;background:var(--page-bg);color:var(--ink);}
  .field input:focus{outline:2px solid var(--blue);border-color:var(--blue);}
  .row-between{display:flex;justify-content:flex-end;margin:-6px 0 20px;}
  .row-between a{font-size:12.5px;font-weight:600;color:var(--blue);}
  .btn-primary{width:100%;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 6px 18px -6px rgba(46,134,222,.55);}
  .btn-primary:hover{background:var(--blue-dark);}
  .footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--muted);}
  @media (max-width:420px){ .card{padding:32px 24px;} }
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>
<div class="card">
  <div class="mark">S</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to Staff Connection ehf. to continue.</p>
  <div class="field"><label>Email</label><input type="email" placeholder="you@company.com"></div>
  <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
  <div class="row-between"><a href="#">Forgot password?</a></div>
  <button class="btn-primary">Sign in</button>
  <div class="footer">Staff Connection ehf. &middot; Reykjavik, Iceland</div>
</div>
<script>
function toggleTheme(){
  var root = document.documentElement;
  var current = root.getAttribute('data-theme');
  var isDark = current ? current === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  var next = isDark ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('sc-theme-modern-minimal', next); }catch(e){}
}
</script>
</body>
</html>
